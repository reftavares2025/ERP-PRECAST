<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('/files/inter-latin-wght-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('/files/inter-latin-ext-wght-normal.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }

    :root { --bg:#0F172A; --card:#1E293B; --line:#334155; --txt:#f1f5f9; --mut:#94a3b8; --ac:#3B82F6; --ok:#10B981; --err:#ef4444; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--txt); font-family: 'Inter', sans-serif; }
    .wrap { max-width:560px; margin:0 auto; padding:16px 16px 60px; }
    h1 { font-size:18px; margin:6px 0 2px; } .sub { color:var(--mut); font-size:13px; margin-bottom:16px; }
    label { display:block; font-size:12px; font-weight:700; color:var(--mut); text-transform:uppercase; letter-spacing:.4px; margin:14px 0 6px; }
    select, input[type=date], textarea { width:100%; background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:16px; font-family:inherit; }
    textarea { min-height:140px; resize:vertical; line-height:1.4; }
    .linha { display:flex; gap:8px; }
    .chip { flex:1; padding:12px 6px; text-align:center; border:1px solid var(--line); border-radius:10px; background:var(--card); font-size:14px; cursor:pointer; user-select:none; }
    .chip.on { border-color:var(--ac); background:#1E293B; color:#fff; font-weight:700; }
    button { font-family:inherit; font-size:16px; border:none; border-radius:10px; padding:13px 16px; cursor:pointer; color:#fff; background:#2563EB; font-weight:700; }
    button.sec { background:var(--card); border:1px solid var(--line); }
    button.mic.gravando { background:var(--err); animation:pulsa 1s infinite; }
    button:disabled { opacity:.55; }
    @keyframes pulsa { 50% { opacity:.65; } }
    .fotos { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:10px; }
    .fotos .f { position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; background:#000; }
    .fotos img { width:100%; height:100%; object-fit:cover; display:block; }
    .fotos .x { position:absolute; top:4px; right:4px; width:26px; height:26px; padding:0; border-radius:50%; background:rgba(0,0,0,.7); font-size:14px; }
    #msg { margin:14px 0; font-size:14px; min-height:20px; } .ok { color:var(--ok); } .err { color:var(--err); }
    .barra { height:6px; background:var(--card); border-radius:3px; overflow:hidden; display:none; margin-top:8px; } .barra div { height:100%; width:0; background:var(--ac); transition:width .2s; }
    .reg { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:10px; }
    .reg .t { font-size:12px; color:var(--mut); margin-bottom:6px; } .reg .p { font-size:14px; white-space:pre-wrap; }
    .reg .fotos { grid-template-columns:repeat(4, 1fr); } .dica { font-size:12px; color:var(--mut); margin-top:6px; }
  
    /* O sistema ocupa a tela inteira: esconde a barra e o rodapé do site que o ERPNext coloca em volta das páginas. */
    body > .navbar, header.navbar, nav.navbar, .web-footer, footer.web-footer, .page-header, .page-breadcrumbs { display: none !important; }
    .page_content, .page-content-wrapper, main.container, .container.my-4 { margin: 0 !important; padding: 0 !important; max-width: none !important; }
    body { margin: 0 !important; }
  </style>
</head>
<body>
<div class="wrap">
  <h1><img src="/files/precast_logo.png" alt="" style="height:26px;width:26px;vertical-align:middle;margin-right:8px">Diário de Obra</h1>
  <div class="sub">Registre o que foi feito no dia. O cliente acompanha pelo portal dele.</div>

  <label for="obra">Obra</label>
  <select id="obra" onchange="carregarRegistros()"></select>

  <label for="data">Data</label>
  <input type="date" id="data">

  <label>Clima</label>
  <div class="linha" id="clima">
    <div class="chip" data-v="Sol">☀️ Sol</div><div class="chip" data-v="Nublado">⛅ Nublado</div><div class="chip" data-v="Chuva">🌧️ Chuva</div>
  </div>

  <label for="resumo">O que foi feito hoje</label>
  <textarea id="resumo" placeholder="Fale ou escreva: pilares montados, vigas içadas, equipe, problemas..."></textarea>
  <div class="linha" style="margin-top:8px;">
    <button class="sec mic" id="btnMic" type="button" onclick="alternarDitado()">🎤 Ditar</button>
  </div>
  <div class="dica" id="dicaDitado"></div>

  <label>Fotos</label>
  <div class="linha">
    <button class="sec" type="button" onclick="document.getElementById('cam').click()">📷 Tirar foto</button>
    <button class="sec" type="button" onclick="document.getElementById('gal').click()">🖼️ Da galeria</button>
  </div>
  <input type="file" id="cam" accept="image/*" capture="environment" style="display:none" onchange="adicionarFotos(this)">
  <input type="file" id="gal" accept="image/*" multiple style="display:none" onchange="adicionarFotos(this)">
  <div class="fotos" id="previas"></div>

  <div id="msg"></div>
  <button id="btnEnviar" type="button" style="width:100%;" onclick="enviar()">✓ Enviar registro</button>
  <div class="barra" id="barra"><div></div></div>

  <label style="margin-top:28px;">Registros recentes desta obra</label>
  <div id="lista"></div>
</div>

<script>
  const API = window.location.origin + '/api/method/frappe.precast_api.';
  let _tokenPromessa = null;
  const tokenCsrf = () => _tokenPromessa || (_tokenPromessa = fetch(API + 'token_csrf', { credentials: 'include' })
    .then(r => r.json()).then(j => (j.message && j.message.token) || '').catch(() => { _tokenPromessa = null; return ''; }));
  const MAX_LADO = 1600;
  let fotos = [];          // Blobs já reduzidos
  let clima = '';
  let reconhecimento = null, ditando = false;

  function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function aviso(txt, cls) { const m = document.getElementById('msg'); m.className = cls || ''; m.textContent = txt || ''; }

  async function api(metodo, corpo) {
    let r;
    try { r = await fetch(API + metodo, { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json', 'X-Frappe-CSRF-Token': await tokenCsrf() }, body: JSON.stringify(corpo || {}) }); }
    catch (e) { return { success: false, error: 'Sem conexão com o servidor. Confira o sinal e tente de novo.' }; }
    if (r.status === 401 || r.status === 403) { window.location.href = '/login?redirect-to=/diario-obra'; return { success: false, error: 'Entre com seu login.' }; }
    try { const j = await r.json(); return j.message || { success: false, error: 'Resposta inesperada do servidor.' }; }
    catch (e) { return { success: false, error: `O servidor respondeu com erro ${r.status}. Tente de novo.` }; }
  }

  document.querySelectorAll('#clima .chip').forEach(c => c.onclick = () => {
    const ja = c.classList.contains('on');
    document.querySelectorAll('#clima .chip').forEach(x => x.classList.remove('on'));
    clima = ja ? '' : c.dataset.v; if (!ja) c.classList.add('on');
  });

  // ---- ditado pelo celular (Web Speech API) ----
  const Reconhecedor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Reconhecedor) {
    document.getElementById('btnMic').style.display = 'none';
    document.getElementById('dicaDitado').textContent = 'Para ditar, toque no microfone do teclado do celular.';
  }
  function alternarDitado() {
    if (!Reconhecedor) return;
    const caixa = document.getElementById('resumo'), botao = document.getElementById('btnMic');
    if (ditando) { reconhecimento.stop(); return; }
    reconhecimento = new Reconhecedor();
    reconhecimento.lang = 'pt-BR'; reconhecimento.continuous = true; reconhecimento.interimResults = false;
    reconhecimento.onresult = e => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) caixa.value += (caixa.value && !caixa.value.endsWith(' ') ? ' ' : '') + e.results[i][0].transcript.trim();
      }
    };
    reconhecimento.onerror = e => { aviso(e.error === 'not-allowed' ? 'Permita o uso do microfone no navegador para ditar.' : 'Não consegui ouvir. Tente de novo ou escreva.', 'err'); };
    reconhecimento.onend = () => { ditando = false; botao.classList.remove('gravando'); botao.textContent = '🎤 Ditar'; };
    reconhecimento.start(); ditando = true; botao.classList.add('gravando'); botao.textContent = '⏹ Parar'; aviso('');
  }

  // ---- fotos: reduz antes de enviar (celular gera arquivos de 4-8 MB) ----
  function reduzir(arquivo) {
    return new Promise((ok, falha) => {
      const img = new Image(), url = URL.createObjectURL(arquivo);
      img.onload = () => {
        const k = Math.min(1, MAX_LADO / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob(b => b ? ok(b) : falha(new Error('foto')), 'image/jpeg', 0.82);
      };
      img.onerror = () => falha(new Error('Não consegui abrir a foto.'));
      img.src = url;
    });
  }
  async function adicionarFotos(input) {
    for (const a of input.files) {
      if (fotos.length >= 12) { aviso('Máximo de 12 fotos por registro.', 'err'); break; }
      try { fotos.push(await reduzir(a)); } catch (e) { aviso(e.message, 'err'); }
    }
    input.value = ''; desenharPrevias();
  }
  function desenharPrevias() {
    document.getElementById('previas').innerHTML = fotos.map((b, i) =>
      `<div class="f"><img src="${URL.createObjectURL(b)}"><button class="x" type="button" onclick="fotos.splice(${i},1); desenharPrevias();">✕</button></div>`).join('');
  }

  // ---- envio ----
  async function enviar() {
    const obra = document.getElementById('obra').value, resumo = document.getElementById('resumo').value.trim();
    if (!obra) { aviso('Escolha a obra.', 'err'); return; }
    if (!resumo && !fotos.length) { aviso('Escreva (ou dite) o que foi feito ou anexe uma foto.', 'err'); return; }
    const f = new FormData();
    f.append('obra', obra); f.append('data', document.getElementById('data').value); f.append('clima', clima); f.append('resumo', resumo);
    fotos.forEach((b, i) => f.append('fotos', b, `foto${i + 1}.jpg`));
    const botao = document.getElementById('btnEnviar'), barra = document.getElementById('barra');
    botao.disabled = true; barra.style.display = 'block'; aviso('Enviando...');
    const x = new XMLHttpRequest();
    x.open('POST', API + 'registrar_diario'); x.withCredentials = true;
    x.setRequestHeader('X-Frappe-CSRF-Token', await tokenCsrf());
    x.upload.onprogress = e => { if (e.lengthComputable) barra.firstElementChild.style.width = Math.round(e.loaded / e.total * 100) + '%'; };
    x.onload = () => {
      botao.disabled = false; barra.style.display = 'none'; barra.firstElementChild.style.width = '0';
      if (x.status === 401 || x.status === 403) { window.location.href = '/login?redirect-to=/diario-obra'; return; }
      let m; try { m = JSON.parse(x.responseText).message; } catch (e) { m = null; }
      if (m && m.success) {
        aviso('✅ ' + m.message, 'ok'); document.getElementById('resumo').value = ''; fotos = []; desenharPrevias(); carregarRegistros();
      } else aviso((m && m.error) || `O servidor respondeu com erro ${x.status}. Tente de novo.`, 'err');
    };
    x.onerror = () => { botao.disabled = false; barra.style.display = 'none'; aviso('Sem conexão. A foto não foi perdida: confira o sinal e envie de novo.', 'err'); };
    x.send(f);
  }

  async function carregarRegistros() {
    const obra = document.getElementById('obra').value, lista = document.getElementById('lista');
    if (!obra) { lista.innerHTML = ''; return; }
    const d = await api('listar_diario', { obra });
    if (!d.success) { lista.innerHTML = `<div class="dica">${esc(d.error)}</div>`; return; }
    lista.innerHTML = d.registros.map(r => `
      <div class="reg"><div class="t">${esc(r.data.split('-').reverse().join('/'))}${r.clima ? ' · ' + esc(r.clima) : ''} · ${esc(r.autor || '')}</div>
      <div class="p">${esc(r.resumo || '')}</div>
      ${r.fotos.length ? `<div class="fotos">${r.fotos.map(u => `<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" loading="lazy"></a>`).join('')}</div>` : ''}</div>`).join('')
      || '<div class="dica">Nenhum registro ainda.</div>';
  }

  (async function iniciar() {
    document.getElementById('data').value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    const d = await api('obras_para_diario');
    if (!d.success) { aviso(d.error, 'err'); return; }
    const sel = document.getElementById('obra');
    sel.innerHTML = d.obras.map(o => `<option value="${esc(o.codigo_obra)}">${esc(o.codigo_obra)} — ${esc(o.nome_obra || '')}</option>`).join('')
      || '<option value="">Nenhuma obra liberada para você</option>';
    carregarRegistros();
  })();
</script>
</body>
</html>
